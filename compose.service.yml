services:
  audown:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=1g
    stop_grace_period: 15s
    expose:
      - "8080"
      - "9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
