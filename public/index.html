<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>AuDown</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <main class="page-content">
        <section class="download-card" aria-labelledby="page-title">
            <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span>Live Now</p>
            <h1 class="brand" id="page-title">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" focusable="false">
                        <path d="M16 5v21m-8-8 8 8 8-8"></path>
                    </svg>
                </span>
                <span>AuDown</span>
            </h1>

            <p class="form-error" id="form-error" role="status" aria-live="polite" hidden>
                <svg class="form-error-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 2.5 1.8 20.5c-.5.9.1 1.9 1.1 1.9h18.2c1 0 1.6-1 1.1-1.9L13 2.5c-.5-.9-1.5-.9-2 0Z" fill="#ff0000"></path>
                    <path d="M12 8v6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path>
                    <circle cx="12" cy="17.5" r="1.1" fill="#ffffff"></circle>
                </svg>
                <span class="form-error-message"></span>
            </p>

            <form id="download-form" action="/download" method="post">
                <div class="url-controls">
                    <div class="form-field is-entering">
                        <label for="url">유튜브 링크</label>
                        <div class="url-input-wrap">
                            <input
                                id="url"
                                name="url"
                                type="url"
                                placeholder="https://www.youtube.com/watch?v=..."
                                autocomplete="url"
                                aria-describedby="form-error"
                                required
                            >
                            <span class="url-loading-spinner" aria-hidden="true" hidden></span>
                        </div>
                    </div>
                    <button class="lookup-button" id="lookup-button" type="button" aria-controls="video-preview time-fieldset submit-button">
                        <span>조회하기</span>
                        <span class="button-arrow" aria-hidden="true">↗</span>
                    </button>
                </div>
                <input id="url-submission" type="hidden" name="url" value="" disabled>
                <input id="download-token" type="hidden" name="downloadToken" value="">

                <section class="video-preview" id="video-preview" aria-labelledby="video-title" hidden>
                    <div class="video-thumbnail-wrap" id="video-thumbnail-wrap">
                        <img id="video-thumbnail" alt="" loading="lazy" decoding="async">
                    </div>
                    <div class="video-preview-copy">
                        <p class="video-preview-label">영상 정보</p>
                        <h2 class="video-preview-title" id="video-title"></h2>
                    </div>
                </section>

                <fieldset class="time-fieldset" id="time-fieldset" hidden>
                    <legend>구간 선택 <span>전체 길이 <strong id="duration-value">00:00:00</strong></span></legend>
                    <div class="range-values">
                        <label class="range-value" for="start-range">
                            <span>시작</span>
                            <output id="start-time-display" for="start-range">00:00:00</output>
                        </label>
                        <label class="range-value" for="end-range">
                            <span>종료</span>
                            <output id="end-time-display" for="end-range">00:00:00</output>
                        </label>
                    </div>
                    <div class="range-slider" id="range-slider">
                        <div class="range-track" aria-hidden="true">
                            <div class="range-selection" id="range-selection"></div>
                        </div>
                        <input class="range-input" id="start-range" type="range" min="0" max="1" value="0" step="1" aria-label="시작 시간">
                        <input class="range-input" id="end-range" type="range" min="0" max="1" value="1" step="1" aria-label="종료 시간">
                    </div>
                    <p class="range-help" id="range-help">양쪽 조절점을 움직여 다운로드할 구간을 선택하세요.</p>
                </fieldset>

                <input id="startTime" name="startTime" type="hidden" value="">
                <input id="endTime" name="endTime" type="hidden" value="">

                <button class="submit-button" id="submit-button" type="submit" hidden>
                    <span id="submit-label">노래 다운로드</span>
                    <span class="button-status" aria-hidden="true">
                        <span class="button-arrow">↗</span>
                        <span class="button-loading-spinner" hidden></span>
                    </span>
                </button>
            </form>
        </section>
    </main>
    <script type="module" src="/static/js/index.js"></script>
</body>
</html>
