services:
  audown:
    extends:
      file: compose.service.yml
      service: audown
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgresql://dev:dev@postgres:5432/dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "dev", "-d", "dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
